<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <style>
        body {
            margin: 0;
            padding: 32px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .about-container {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
            width: 100%;
            max-width: 340px;
        }
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: linear-gradient(135deg, #007aff, #5856d6);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon svg {
            width: 40px;
            height: 40px;
            stroke: white;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 600;
        }
        .version {
            color: #86868b;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .description {
            font-size: 14px;
            line-height: 1.5;
            color: #424245;
            margin-bottom: 24px;
        }
        .divider {
            height: 1px;
            background: #e5e5ea;
            margin: 20px 0;
        }
        .copyright {
            font-size: 12px;
            color: #86868b;
        }
        .links {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 20px;
        }
        .links a {
            color: #007aff;
            text-decoration: none;
            font-size: 13px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        button {
            background: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 16px;
            transition: background 0.2s;
        }
        button:hover {
            background: #0056cc;
        }
    </style>
</head>
<body>
    <div class="about-container">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
        </div>
        <h1>TrayTest</h1>
        <div class="version">Version 0.1.0</div>
        <p class="description">A simple Tauri 2.0 system tray application for macOS.</p>
        <div class="divider"></div>
        <div class="copyright">Built with Tauri, Rust, and ❤️</div>
        <div class="links">
            <a href="https://tauri.app" target="_blank">Tauri</a>
            <a href="https://github.com/tauri-apps/tauri" target="_blank">GitHub</a>
        </div>
        <button onclick="window.close()">Close</button>
    </div>
</body>
</html>
